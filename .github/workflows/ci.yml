name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-assistant:ci .
      - name: Smoke test
        run: |
          docker run -d --name ai -p 8090:8090 -e AI_ENV=production -e AI_SERVICE_TOKEN=ci-token-0123456789abcdef0123456789abcdef \
            -e AI_FAST_PROVIDER=hosted -e AI_HOSTED_BASE_URL=https://example.invalid/v1 -e AI_HOSTED_API_KEY=x -e AI_HOSTED_MODEL=m ai-assistant:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/v1/chat)" = "401"
          docker logs ai
